name: Tests

on:
  push:
    branches: [master, dev, "feature/*", "cli/*", "test/*"]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache NLTK data
        uses: actions/cache@v3
        with:
          path: ~/nltk_data
          key: ${{ runner.os }}-nltk-stopwords-wordnet-punkt-tagger-v1

      - name: Download NLTK data
        run: |
          python -m nltk.downloader stopwords wordnet punkt punkt_tab averaged_perceptron_tagger_eng

      - name: Lint check with ruff
        run: ruff check src/ tests/

      - name: Format check with black
        run: |
          black --check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Security check with bandit
        run: bandit -c pyproject.toml -r src/ tests/

      - name: Test with pytest
        run: pytest tests/ --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
